services:
  postgres:
    image: postgres:16-alpine
    container_name: diffpay-postgres
    environment:
      POSTGRES_DB: diffpay
      POSTGRES_USER: diffpay
      POSTGRES_PASSWORD: diffpay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
